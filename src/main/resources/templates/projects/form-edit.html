<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: ~{body}}">
<body>
<div th:fragment="content">
    <h1>Edit Project</h1>

    <!-- Binds to 'projectForm' and POSTs to /projects/{id}/edit -->
    <form th:action="@{/projects/{id}/edit(id=${projectId})}"
          th:object="${projectForm}"
          method="post">

        <div class="mb-3">
            <label for="name" class="form-label">Project Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/projects/{id}(id=${projectId})}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>

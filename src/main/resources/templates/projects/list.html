<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: ~{body}}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>All Projects</h1>
        <a th:href="@{/projects/new}" class="btn btn-primary">Create New Project</a>
    </div>

    <div th:if="${projects.isEmpty()}">
        <p class="alert alert-info">No projects found. Why not create one?</p>
    </div>

    <div th:if="${!projects.isEmpty()}" class="list-group">
        <!-- Note: We are iterating over a list of ProjectListDto -->
        <a th:each="project : ${projects}"
           th:href="@{/projects/{id}(id=${project.id})}"
           class="list-group-item list-group-item-action">
            <div class="d-flex w-100 justify-content-between">
                <h5 class="mb-1" th:text="${project.name}">Project Name</h5>
                <small th:text="'Owner: ' + ${project.ownerUsername}">Owner</small>
            </div>
            <p class="mb-1" th:text="${project.description}">Project description goes here.</p>
        </a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <title th:text="${pageTitle} ?: 'Task Management'">Task Management</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/projects}">Task Manager</a>
        <!-- ... (navbar-toggler) -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Elemente afișate doar dacă utilizatorul este autentificat -->
            <div sec:authorize="isAuthenticated()" class="ms-auto d-flex align-items-center">
                <span class="navbar-text me-3">
                    Welcome, <strong sec:authentication="name">Username</strong>
                </span>
                <!-- Butonul de Logout trebuie să fie un formular POST -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container">
    <div th:replace="~{this :: content}">
        <!-- Page-specific content will be injected here -->
    </div>
</main>

<footer class="text-center mt-5 text-muted">
    <p>&copy; 2025 Task Management App</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
